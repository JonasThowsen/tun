<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign off</title>
<link rel="stylesheet" href="/sign-off/screen.css">
<script type="module" src="/sign-off/dist/screen.js"></script>
</head>
<body>
<main>
  <h1>Sign off</h1>
  <p id="count" class="muted">&nbsp;</p>
  <form id="sign-off" novalidate>
    <label for="note">Note</label>
    <textarea id="note" name="note" rows="3" aria-describedby="note-error"></textarea>
    <p id="note-error" class="error" hidden></p>
    <button type="submit">Sign off</button>
  </form>
  <p id="answer" role="status"></p>
</main>
</body>
</html>
